name: Build ZalaxyMusic VST3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify JUCE submodule
      run: |
        cd JUCE
        echo "JUCE commit: $(git rev-parse --short HEAD)"
        git describe --tags 2>$null || echo "No tag at this commit (detached HEAD)"
        ls modules
      shell: pwsh

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'

    - name: Check build tools
      run: |
        ninja --version
        cmake --version
        # Verify MSVC is available
        & "${env:VCToolsInstallDir}bin\Hostx64\x64\cl.exe" 2>&1 | Select-String "Version"
      shell: pwsh

    - name: Configure CMake (MSVC)
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DJUCE_DIR="${{ github.workspace }}/JUCE" `
          -DVST3_SDK_PATH="" `
          .
      shell: pwsh

    - name: Build
      run: cmake --build build --config Release --parallel
      shell: pwsh

    - name: Verify VST3 output
      run: |
        $vst3Path = "build/bin/Release/ZalaxyMusic.vst3/Contents/x86_64-win/ZalaxyMusic.vst3"
        if (Test-Path $vst3Path) {
          Write-Host "VST3 built successfully at $vst3Path!"
        } else {
          Write-Host "VST3 not found at expected location"
          Get-ChildItem -Recurse build/bin
          exit 1
        }
      shell: pwsh

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZalaxyMusic-Windows-VST3
        path: build/bin/Release/ZalaxyMusic.vst3/
        retention-days: 30

  build-test:
    name: Run Tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'

    - name: Configure CMake with Tests (MSVC)
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Debug `
          -DJUCE_DIR="${{ github.workspace }}/JUCE" `
          -DVST3_SDK_PATH="" `
          .
      shell: pwsh

    - name: Build Tests
      run: cmake --build build --config Debug --parallel
      shell: pwsh

    - name: Run Tests
      run: |
        cd build
        ctest --output-on-failure -C Debug
      shell: pwsh