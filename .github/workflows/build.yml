name: Build ZalaxyMusic VST3

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows VST3
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Verify JUCE submodule
      shell: pwsh
      run: |
        cd JUCE
        $commit = git rev-parse --short HEAD
        echo "JUCE commit: $commit"
        # git describe --tags returns non-zero if no tag - handle gracefully
        $tag = git describe --tags 2>$null
        if ($LASTEXITCODE -eq 0) { echo "JUCE tag: $tag" }
        else { echo "No tag at this commit (detached HEAD)" }
        echo "Modules found: $(ls modules | Measure-Object | % { $_.Count })"
        exit 0

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Check build tools
      shell: pwsh
      run: |
        ninja --version
        cmake --version
        cl 2>&1 | Select-String "Version"

    - name: Configure CMake (Ninja + MSVC)
      shell: pwsh
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DJUCE_DIR="${{ github.workspace }}/JUCE" `
          -DVST3_SDK_PATH="" `
          .

    - name: Build
      shell: pwsh
      run: cmake --build build --config Release --parallel

    - name: Verify VST3 output
      shell: pwsh
      run: |
        $vst3Path = "build/bin/ZalaxyMusic.vst3/Contents/x86_64-win/ZalaxyMusic.vst3"
        if (Test-Path $vst3Path) {
          Write-Host "VST3 built successfully at $vst3Path!"
        } else {
          Write-Host "VST3 not found at expected location"
          Get-ChildItem -Recurse build/bin
          exit 1
        }

    - name: Upload VST3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ZalaxyMusic-Windows-VST3
        path: build/bin/ZalaxyMusic.vst3/
        retention-days: 30

  build-test:
    name: Run Tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup CMake
      uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.28'

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake with Tests (Ninja + MSVC)
      shell: pwsh
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_BUILD_TYPE=Debug `
          -DCMAKE_C_COMPILER=cl `
          -DCMAKE_CXX_COMPILER=cl `
          -DJUCE_DIR="${{ github.workspace }}/JUCE" `
          -DVST3_SDK_PATH="" `
          .

    - name: Build Tests
      shell: pwsh
      run: cmake --build build --config Debug --parallel

    - name: Run Tests
      shell: pwsh
      run: |
        cd build
        ctest --output-on-failure -C Debug